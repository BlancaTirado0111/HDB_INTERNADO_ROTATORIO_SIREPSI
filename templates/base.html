{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}SIREPSI{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 (CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Estilos SIREPSI -->
  <link href="{% static 'theme/app.css' %}" rel="stylesheet" />
</head>
<body>
  <!-- Header principal del sitio -->
  <header class="app-header">
    <div class="container d-flex flex-column">
      <div class="d-flex align-items-baseline justify-content-between">
        <h1 class="fs-3 mb-0">
          <span class="fw-bold text-success">SIREPSI</span>
        </h1>
      </div>

      <!-- Navegación principal -->
      <nav class="nav mt-2" role="navigation" aria-label="Navegación principal">
        {% with current=request.resolver_match.url_name %}
          <a class="nav-link p-0 me-3 {% if current == 'home' %}active{% endif %}" href="{% url 'home' %}" {% if current == 'home' %}aria-current="page"{% endif %}>
            Inicio
          </a>
          <a class="nav-link p-0 me-3 {% if current == 'medicamentos' %}active{% endif %}" href="{% url 'medicamentos' %}" {% if current == 'medicamentos' %}aria-current="page"{% endif %}>
            Medicamentos
          </a>
          <a class="nav-link p-0 me-3 {% if current == 'movimientos' %}active{% endif %}" href="{% url 'movimientos' %}" {% if current == 'movimientos' %}aria-current="page"{% endif %}>
            Movimientos
          </a>
          <a class="nav-link p-0 {% if current == 'prescripciones' %}active{% endif %}" href="{% url 'prescripciones' %}" {% if current == 'prescripciones' %}aria-current="page"{% endif %}>
            Prescripciones
          </a>
        {% endwith %}
      </nav>
    </div>
  </header>

  <!-- Contenido específico de cada vista -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer fijo al viewport -->
  <footer class="app-footer">
    <!-- wrapper interno para mantener el mismo ancho del sitio -->
    <div class="footer-inner d-flex justify-content-between align-items-center">
      <span>v0.1 • UATF</span>
      <span class="text-muted">SIREPSI</span>
    </div>
  </footer>

  <!-- Bootstrap (JS bundle con Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Efecto de sombra en header al hacer scroll (estético) -->
  <script>
    (function () {
      const header = document.querySelector('.app-header');
      if (!header) return;

      const toggleShadow = () => {
        if (window.scrollY > 4) {
          header.style.boxShadow = '0 6px 16px rgba(0,0,0,.07)';
        } else {
          header.style.boxShadow = '0 1px 0 rgba(0,0,0,.06)';
        }
      };

      toggleShadow();
      window.addEventListener('scroll', toggleShadow, { passive: true });
    })();
  </script>
</body>
</html>
