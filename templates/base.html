{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}SIREPSI{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Estilos SIREPSI -->
  <link href="{% static 'theme/app.css' %}" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="container d-flex flex-column">
      <div class="d-flex align-items-baseline justify-content-between">
        <h1 class="fs-3 mb-0">
          <span class="fw-bold text-success">SIREPSI</span>
        </h1>
        <!-- (opcional) espacio para logo -->
      </div>

      <nav class="nav mt-2">
           {% with current=request.resolver_match.url_name %}
            <a class="nav-link p-0 me-3 {% if current == 'home' %}active{% endif %}" href="{% url 'home' %}">Inicio</a>
            <a class="nav-link p-0 me-3 {% if current == 'medicamentos' %}active{% endif %}" href="{% url 'medicamentos' %}">Medicamentos</a>
            <!-- antes tenía #, ahora apunta a 'movimientos' -->
            <a class="nav-link p-0 me-3 {% if current == 'movimientos' %}active{% endif %}" href="{% url 'movimientos' %}">Movimientos</a>
            <a class="nav-link p-0 {% if current == 'prescripciones' %}active{% endif %}" href="{% url 'prescripciones' %}">Prescripciones</a>
          {% endwith %}
      </nav>


    </div>
  </header>

  <!-- Hero solo se usa en home (lo colocaremos ahí) -->

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container d-flex justify-content-between">
      <span>v0.1 • UATF</span>
      <span class="text-muted">SIREPSI</span>
    </div>
  </footer>

  <!-- Bootstrap bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Sombra del header al hacer scroll (solo estética) -->
  <script>
    const header = document.querySelector('.app-header');
    const toggleShadow = () => {
      if (window.scrollY > 4) {
        header.style.boxShadow = '0 6px 16px rgba(0,0,0,.07)';
      } else {
        header.style.boxShadow = '0 1px 0 rgba(0,0,0,.06)';
      }
    };
    toggleShadow();
    window.addEventListener('scroll', toggleShadow);
  </script>
</body>
</html>
